name: Atualizar cartão do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch:      # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: [gerar_perfil.py, ascii.txt]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar SVGs
        run: python gerar_perfil.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || git commit -m "Atualiza cartão do perfil"
          git push
